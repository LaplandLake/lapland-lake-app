<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lapland Lake</title>
  <meta name="description" content="Lapland Lake Nordic Vacation Center guest app: trail conditions, tickets, lessons, trail map, café menu, lodging and guest photos.">
  <meta name="theme-color" content="#ffffff">

  <!-- How the link looks when shared on Facebook, in texts, etc. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Lapland Lake">
  <meta property="og:title" content="The Lapland Lake App">
  <meta property="og:description" content="Trail conditions, tickets, the trail map, the café menu and more for Lapland Lake Nordic Vacation Center. Save it to your phone's home screen.">
  <meta property="og:url" content="https://laplandlake.github.io/lapland-lake-app/">
  <meta property="og:image" content="https://laplandlake.github.io/lapland-lake-app/images/share-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Lapland Lake logo">
  <meta name="twitter:card" content="summary_large_image">

  <!-- "Add to Home Screen" support -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="images/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lapland Lake">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="back" id="back" hidden aria-label="Back to home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span>Home</span>
    </a>
    <a href="#/" class="brand" aria-label="Lapland Lake home">
      <img class="logo-wide" src="images/logo-wide.svg" alt="Lapland Lake" width="220" height="45">
      <img class="logo-mark" src="images/logo-mark.svg" alt="Lapland Lake" width="79" height="40">
    </a>
  </header>

  <main id="view" tabindex="-1">
    <noscript><p class="card">Please turn on JavaScript to use this app.</p></noscript>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
