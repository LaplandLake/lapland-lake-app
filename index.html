<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lapland Lake</title>
  <meta name="description" content="Lapland Lake Nordic Vacation Center guest app: tickets, trail conditions, trail map, soup and menu, lodge map.">
  <meta name="theme-color" content="#ffffff">

  <!-- "Add to Home Screen" support -->
  <link rel="manifest" href="manifest.webmanifest">
