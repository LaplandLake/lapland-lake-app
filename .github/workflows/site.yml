# Publishes the app to GitHub Pages, and around the clock copies the latest trail report
# from the Lapland Lake website: most often in the morning, when the report is posted.
# GitHub's timer is only a request: it runs late or skips when busy, most of all on the
# hour and half hour, so we ask often and at odd minutes.
name: Update and publish app

on:
  push:
    branches: [main]
  schedule:
    # Ski season only: November 1 through March 31. From April the timer rests until November;
    # the "Run workflow" button (and any push to main) still copies the report.
    # Times are UTC. Eastern winter time is 5 hours behind (summer time: 4, so everything runs an hour later).
    - cron: '7,17,27,37,47,57 10-15 * 1-3,11-12 *'   # every 10 min, 5am-11am Eastern
    - cron: '7,37 16-19 * 1-3,11-12 *'               # every half hour, 11am-3pm Eastern
    - cron: '7 0-9,20-23 * 1-3,11-12 *'              # every hour, 3pm-5am Eastern
  workflow_dispatch:              # "Run workflow" button on GitHub

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Copy trail report from website
        id: report
        run: |
          npm run update-trail-report || echo "Trail report update failed; keeping the previous report."
          if git diff --quiet content/trail-report.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "Lapland Lake trail report bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "Update trail report"
            git pull --rebase && git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Scheduled runs only republish when the report changed.
      - name: Gather app files
        if: github.event_name != 'schedule' || steps.report.outputs.changed == 'true'
        run: |
          mkdir _site
          cp -r index.html review.html sw.js manifest.webmanifest css js content images maps _site/
          # Supply Manager (staff site). Only the web files; never tests, dev tools or backend.
          mkdir -p _site/supply
          cp -r supply/index.html supply/app.js supply/admin.js supply/charts.js supply/config.js supply/styles.css supply/manifest.webmanifest supply/assets _site/supply/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.report.outputs.changed == 'true'
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
        if: github.event_name != 'schedule' || steps.report.outputs.changed == 'true'
